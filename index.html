<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#06101d">
  <title>Solar System Explorer</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://interactive-planets.vercel.app/">
  <meta property="og:title" content="Solar System Explorer">
  <meta property="og:description" content="A NASA-informed interactive model of the eight planets and their orbits.">
  <meta property="og:image" content="https://interactive-planets.vercel.app/og-image.jpg">
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:title" content="Solar System Explorer">
  <meta property="twitter:description" content="A NASA-informed interactive model of the eight planets and their orbits.">
  <meta property="twitter:image" content="https://interactive-planets.vercel.app/og-image.jpg">
  <style>
    :root { color-scheme: dark; --ink:#f5f7fb; --muted:#b6c0cf; --line:rgba(222,234,255,.19); --surface:rgba(5,14,27,.8); --surface-strong:rgba(4,11,22,.94); --accent:#8fc8ff; --focus:#ffe071; }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; overflow:hidden; background:#01050b; color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button,input { font:inherit; }
    canvas { display:block; height:100vh; width:100vw; }
    button { border:0; cursor:pointer; }
    button:focus-visible,input:focus-visible { outline:2px solid var(--focus); outline-offset:3px; }
    #loading-screen { align-items:center; background:#01050b; display:flex; flex-direction:column; height:100%; justify-content:center; position:fixed; transition:opacity 350ms ease; width:100%; z-index:20; }
    .loading-kicker,.eyebrow,.mini-label { color:var(--accent); font-size:.69rem; font-weight:750; letter-spacing:.08em; margin:0; text-transform:uppercase; }
    #loading-screen h1 { font-size:clamp(1.6rem,3vw,2.35rem); letter-spacing:0; margin:.35rem 0 1rem; }
    #loading-bar { background:rgba(255,255,255,.14); height:3px; overflow:hidden; width:min(17rem,70vw); }
    #loading-progress { background:linear-gradient(90deg,#8fc8ff,#fff0a8); height:100%; transition:width 180ms ease; width:0%; }
    .overlay { pointer-events:none; position:fixed; z-index:2; }
    .topbar { align-items:flex-start; display:flex; gap:1rem; justify-content:space-between; left:clamp(1rem,2.5vw,2.25rem); right:clamp(1rem,2.5vw,2.25rem); top:clamp(1rem,2.5vw,2rem); }
    .brand { text-shadow:0 2px 16px #000; }
    .brand h1 { font-size:clamp(1.35rem,2.1vw,1.85rem); font-weight:720; letter-spacing:0; line-height:1.05; margin:.22rem 0 0; }
    .brand p:last-child { color:var(--muted); font-size:.79rem; margin:.4rem 0 0; }
    .toolbar { align-items:center; background:var(--surface); border:1px solid var(--line); display:flex; gap:.25rem; padding:.28rem; pointer-events:auto; }
    .toolbar button { background:transparent; color:var(--ink); font-size:.78rem; font-weight:680; min-height:2.2rem; padding:0 .7rem; }
    .toolbar button:hover,.toolbar button[aria-pressed="true"] { background:rgba(143,200,255,.17); color:#fff; }
    .info-card { background:var(--surface-strong); border:1px solid var(--line); bottom:clamp(1rem,2.5vw,2rem); left:clamp(1rem,2.5vw,2.25rem); max-height:min(61vh,39rem); overflow:auto; padding:1.1rem; pointer-events:auto; width:min(23.5rem,calc(100vw - 2rem)); }
    .card-heading { align-items:baseline; display:flex; gap:.65rem; justify-content:space-between; }
    .card-heading h2 { font-size:1.5rem; letter-spacing:0; line-height:1.08; margin:.24rem 0 0; }
    .body-type { color:var(--accent); font-size:.72rem; font-weight:700; text-align:right; }
    .summary { color:#e3eaf5; font-size:.87rem; line-height:1.52; margin:.8rem 0 1rem; }
    .fact-grid { border-top:1px solid var(--line); display:grid; grid-template-columns:1fr 1fr; margin:0; }
    .fact-grid div { border-bottom:1px solid var(--line); min-width:0; padding:.65rem .55rem .66rem 0; }
    .fact-grid div:nth-child(2n) { padding-left:.55rem; padding-right:0; }
    .fact-grid dt { color:var(--muted); font-size:.66rem; font-weight:700; letter-spacing:.055em; margin-bottom:.22rem; text-transform:uppercase; }
    .fact-grid dd { font-size:.83rem; font-variant-numeric:tabular-nums; line-height:1.25; margin:0; }
    .source-note { color:var(--muted); font-size:.71rem; line-height:1.35; margin:.85rem 0 0; }
    .source-note a { color:var(--accent); }
    .explorer-controls { background:var(--surface); border:1px solid var(--line); bottom:clamp(1rem,2.5vw,2rem); padding:.85rem .95rem; pointer-events:auto; right:clamp(1rem,2.5vw,2.25rem); width:min(19rem,calc(100vw - 2rem)); }
    .rate-row { align-items:center; display:grid; gap:.6rem; grid-template-columns:auto 1fr auto; margin-top:.55rem; }
    .rate-row label,.rate-value { font-size:.74rem; font-weight:650; }
    .rate-value { color:var(--accent); font-variant-numeric:tabular-nums; }
    .rate-row input { accent-color:#8fc8ff; min-width:0; width:100%; }
    .body-rail { left:50%; max-width:min(54rem,calc(100vw - 4rem)); overflow-x:auto; pointer-events:auto; top:clamp(7.25rem,10vw,9rem); transform:translateX(-50%); }
    .body-rail-list { display:flex; gap:.36rem; list-style:none; margin:0; padding:0; width:max-content; }
    .body-button { align-items:center; background:var(--surface); border:1px solid var(--line); color:var(--ink); display:flex; font-size:.74rem; font-weight:650; gap:.38rem; min-height:2.18rem; padding:0 .58rem; }
    .body-button:hover,.body-button[aria-current="true"] { background:rgba(143,200,255,.18); border-color:rgba(143,200,255,.55); }
    .body-dot { background:var(--body-color); border-radius:50%; box-shadow:0 0 .55rem var(--body-color); height:.48rem; width:.48rem; }
    @media (max-width:960px) { .body-rail { bottom:auto; left:clamp(1rem,2.5vw,2rem); max-width:calc(100vw - 2rem); right:1rem; top:6.2rem; transform:none; } .body-rail-list { width:max-content; } .info-card { max-height:48vh; } }
    @media (max-width:640px) { .topbar { align-items:flex-start; top:1rem; } .brand p:last-child { display:none; } .toolbar button { min-height:2.05rem; padding:0 .52rem; } .body-rail { top:4.9rem; } .body-button { font-size:.7rem; min-height:2rem; padding:0 .5rem; } .info-card { bottom:5.15rem; max-height:min(42vh,22rem); padding:.9rem; width:calc(100vw - 2rem); } .card-heading h2 { font-size:1.28rem; } .summary { font-size:.81rem; margin:.6rem 0 .7rem; } .explorer-controls { bottom:1rem; padding:.7rem .85rem; width:calc(100vw - 2rem); } }
    @media (max-width:390px) { .eyebrow { font-size:.62rem; } .brand h1 { font-size:1.18rem; } .toolbar { gap:0; } .toolbar button { font-size:.71rem; padding:0 .43rem; } }
  </style>
</head>
<body>
  <div id="loading-screen" role="status" aria-live="polite"><p class="loading-kicker">Planetary field guide</p><h1>Loading the Solar System</h1><div id="loading-bar" aria-hidden="true"><div id="loading-progress"></div></div></div>
  <header class="overlay topbar"><div class="brand"><p class="eyebrow">NASA-informed field guide</p><h1>Solar System Explorer</h1><p>Eight planets, arranged for exploration.</p></div><div class="toolbar" aria-label="Explorer commands"><button id="home-view" type="button" title="Reset to the full solar system">Reset</button><button id="pause-orbits" type="button" aria-pressed="false" title="Pause planetary motion">Pause</button></div></header>
  <nav class="overlay body-rail" aria-label="Celestial bodies"><ul class="body-rail-list" id="body-rail-list"></ul></nav>
  <aside class="overlay info-card" id="info-card" aria-live="polite"></aside>
  <section class="overlay explorer-controls" aria-label="Orbital rate"><p class="mini-label">Orbital rate</p><div class="rate-row"><label for="speed-slider">Motion</label><input type="range" id="speed-slider" min="0" max="3" step="0.25" value="1"><output class="rate-value" id="speed-value" for="speed-slider">1.00x</output></div></section>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="main.js"></script>
  <script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments);};</script><script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
